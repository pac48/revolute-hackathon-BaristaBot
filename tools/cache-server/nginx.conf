# LAN Bazel remote cache (Bazel's HTTP cache protocol), run by `tools/cache serve`.
#
#   PUT /ac/<sha256>, /cas/<sha256>  stored on disk under /data/{ac,cas}
#   GET                              served from /data, else fetched from the RCR's
#                                    public cache and kept under /data/upstream
#
# Nothing is ever sent upstream except reads. Runs as an unprivileged user, so
# every writable path lives under /data or /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 4096;
}

http {
  access_log off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 120s;
  client_max_body_size 0;
  client_body_buffer_size 1m;

  client_body_temp_path /data/tmp/body;
  proxy_temp_path /data/tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Copies of upstream hits. Evicted least-recently-used beyond max_size.
  proxy_cache_path /data/upstream levels=2:2 keys_zone=rcr:64m
                   max_size=@UPSTREAM_MAX_SIZE@ inactive=60d use_temp_path=off;

  # Resolve the upstream at runtime, IPv4 only: Docker's default bridge has no IPv6.
  resolver @RESOLVER@ ipv6=off valid=300s;

  server {
    listen 8080 reuseport;

    root /data;

    location = /status {
      default_type text/plain;
      return 200 "ok\n";
    }

    location ~ "^/(ac|cas)/[0-9a-f]{64}$" {
      limit_except GET HEAD PUT { deny all; }

      # Writes go to local disk only.
      error_page 418 = @store;
      if ($request_method = PUT) { return 418; }

      try_files $uri @upstream;
    }

    location @store {
      dav_methods PUT;
      create_full_put_path on;
      dav_access user:rw group:r all:r;
    }

    location @upstream {
      set $rcr_cache https://storage.googleapis.com;
      rewrite ^ /intrinsic-opensource-buildcache$uri break;
      proxy_pass $rcr_cache;
      proxy_ssl_server_name on;
      proxy_set_header Host storage.googleapis.com;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_cache rcr;
      proxy_cache_key $uri;
      proxy_cache_valid 200 60d;
      proxy_cache_lock on;
      proxy_cache_use_stale error timeout updating;
      # Misses (404) are not cached, so the next lookup asks again.
    }

    location / { return 404; }
  }
}
